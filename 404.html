<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Abhigyan Neog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232449E8'/><text x='16' y='21' font-family='monospace' font-size='14' font-weight='bold' text-anchor='middle' fill='%23FFFFFF'>AN</text></svg>">
  <style>
    :root {
      --bg: #F4F2EB;
      --card-bg: #FAF9F5;
      --border: #D2CEC4;
      --text: #191919;
      --muted: #6B6860;
      --cobalt: #2449E8;
      --cobalt-dark: #1B37B0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3.5rem 3rem;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(25, 25, 25, 0.05), 0 20px 40px rgba(25, 25, 25, 0.06);
      position: relative;
    }

    .error-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cobalt);
      margin-bottom: 1rem;
      display: inline-block;
    }

    .error-code {
      font-family: 'Newsreader', serif;
      font-size: 5rem;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.75rem 1.4rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--cobalt);
      color: #FFFFFF;
      border: 1px solid var(--cobalt);
    }

    .btn-primary:hover {
      background: var(--cobalt-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="error-tag">Error 404 // Resource Missing</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Document Not Found</h1>
    <p class="error-desc">
      The specified URL does not point to an active document or resource in this engineering archive.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Return to Portfolio →</a>
      <a href="/certifications" class="btn btn-secondary">Certifications Archive</a>
    </div>
  </div>
</body>

</html>
